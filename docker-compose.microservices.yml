name: loveconnect-microservices

x-backend-env: &backend-env
  SERVER_PORT: 8080
  MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/loveconnect_mongo}
  APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5180,http://127.0.0.1:5180,http://localhost:8180,https://love-connect-beta.vercel.app}
  APP_JWT_SECRET: ${APP_JWT_SECRET:-change-this-to-a-long-random-production-secret}
  JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-production-secret}
  JWT_EXPIRY: ${JWT_EXPIRY:-86400}
  ALLOW_DEV_TOKENS: ${ALLOW_DEV_TOKENS:-false}
  FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
  BREVO_SMTP_HOST: ${BREVO_SMTP_HOST:-smtp-relay.brevo.com}
  BREVO_SMTP_PORT: ${BREVO_SMTP_PORT:-587}
  BREVO_SMTP_USERNAME: ${BREVO_SMTP_USERNAME:-}
  BREVO_SMTP_PASSWORD: ${BREVO_SMTP_PASSWORD:-}
  BREVO_API_KEY: ${BREVO_API_KEY:-}
  MAIL_FROM: ${MAIL_FROM:-chandershekhar78458@gmail.com}
  SMTP_CONNECTION_TIMEOUT: ${SMTP_CONNECTION_TIMEOUT:-10000}
  SMTP_TIMEOUT: ${SMTP_TIMEOUT:-10000}
  SMTP_WRITE_TIMEOUT: ${SMTP_WRITE_TIMEOUT:-10000}
  APP_DEV_OTP_RESPONSE: ${APP_DEV_OTP_RESPONSE:-false}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

x-backend-service: &backend-service
  build:
    context: ./mongo-firebase-agora-app/backend
  restart: unless-stopped
  depends_on:
    - mongo
  environment:
    <<: *backend-env

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27117:27017"
    volumes:
      - loveconnect-mongo-data:/data/db

  auth-service:
    <<: *backend-service
    environment:
      <<: *backend-env
      SPRING_PROFILES_ACTIVE: auth
    ports:
      - "8181:8080"

  profile-service:
    <<: *backend-service
    environment:
      <<: *backend-env
      SPRING_PROFILES_ACTIVE: profile
    ports:
      - "8182:8080"

  chat-service:
    <<: *backend-service
    environment:
      <<: *backend-env
      SPRING_PROFILES_ACTIVE: chat
    ports:
      - "8183:8080"

  call-service:
    <<: *backend-service
    environment:
      <<: *backend-env
      SPRING_PROFILES_ACTIVE: call
    ports:
      - "8184:8080"

  api-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - auth-service
      - profile-service
      - chat-service
      - call-service
    ports:
      - "8180:80"
    volumes:
      - ./deploy/microservices/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8180/api}
    restart: unless-stopped
    depends_on:
      - api-gateway
    ports:
      - "5180:80"

volumes:
  loveconnect-mongo-data:
