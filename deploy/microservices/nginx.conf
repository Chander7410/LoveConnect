map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;

  resolver 127.0.0.11 valid=10s ipv6=off;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  location = /api/health {
    set $upstream http://auth-service:8080;
    add_header X-LoveConnect-Service auth always;
    proxy_pass $upstream;
  }

  location ^~ /api/auth {
    set $upstream http://auth-service:8080;
    add_header X-LoveConnect-Service auth always;
    proxy_pass $upstream;
  }

  location ^~ /api/profiles {
    set $upstream http://profile-service:8080;
    add_header X-LoveConnect-Service profile always;
    proxy_pass $upstream;
  }

  location ^~ /api/profile {
    set $upstream http://profile-service:8080;
    add_header X-LoveConnect-Service profile always;
    proxy_pass $upstream;
  }

  location /api/search {
    set $upstream http://profile-service:8080;
    add_header X-LoveConnect-Service profile always;
    proxy_pass $upstream;
  }

  location /api/likes {
    set $upstream http://profile-service:8080;
    add_header X-LoveConnect-Service profile always;
    proxy_pass $upstream;
  }

  location /api/notifications {
    set $upstream http://profile-service:8080;
    add_header X-LoveConnect-Service profile always;
    proxy_pass $upstream;
  }

  location /api/subscriptions {
    set $upstream http://profile-service:8080;
    add_header X-LoveConnect-Service profile always;
    proxy_pass $upstream;
  }

  location /api/safety {
    set $upstream http://profile-service:8080;
    add_header X-LoveConnect-Service profile always;
    proxy_pass $upstream;
  }

  location ^~ /api/chats {
    set $upstream http://chat-service:8080;
    add_header X-LoveConnect-Service chat always;
    proxy_pass $upstream;
  }

  location ^~ /api/chat {
    set $upstream http://chat-service:8080;
    add_header X-LoveConnect-Service chat always;
    proxy_pass $upstream;
  }

  location ^~ /api/calls {
    set $upstream http://call-service:8080;
    add_header X-LoveConnect-Service call always;
    proxy_pass $upstream;
  }

  location ^~ /ws {
    set $upstream http://call-service:8080;
    add_header X-LoveConnect-Service call always;
    proxy_pass $upstream;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  location / {
    return 404;
  }
}
